# Убирает последовательность " \\" (пробел + два обратных слэша) из strategies/**/*.conf.
# Полностью удаляет, не заменяет на один \.
#
# Триггеры: push в strategies/, ручной запуск.
# Коммит только если что-то реально изменилось.

name: Fix strategy backslashes

on:
  push:
    branches: [main]
    paths:
      - "strategies/**/*.conf"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-strategy-backslashes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Remove " \\" (space + double backslash)
        id: fix
        run: |
          set -euo pipefail
          mapfile -t files < <(find strategies -type f -name '*.conf' | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .conf files found"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=0
          for f in "${files[@]}"; do
            # Ищем " \\" (пробел + два обратных слэша)
            if grep -qF ' \\' "$f" 2>/dev/null; then
              # Полностью удаляем " \\"
              sed -i 's/ \\\\//g' "$f"
              if ! git diff --quiet -- "$f"; then
                echo "fixed: $f"
                changed=1
              fi
            fi
          done

          if [ "$changed" -eq 1 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No space+double-backslash found — nothing to fix"
          fi

      - name: Commit and push if changed
        if: steps.fix.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add strategies/
          git commit -m "fix: remove space+double-backslash from strategies [skip ci]"
          git push
